name: Diagnostic du démarrage du runner

on:
  push:
    branches:
      - codex/native-runner-check

permissions:
  contents: read

jobs:
  runner-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Vérifier le démarrage natif
        shell: bash
        run: python3 --version
