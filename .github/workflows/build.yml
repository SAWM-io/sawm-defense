name: Test and build desktop clients
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .[dev]
      - run: python -m pytest -q
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: sawm-defense-${{ matrix.os }}
          path: dist/
          retention-days: 14
