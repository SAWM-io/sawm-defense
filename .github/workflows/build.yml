name: Test and build desktop clients
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-clients-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary: dist/sawm-defense/sawm-defense
          - os: windows-latest
            binary: dist/sawm-defense/sawm-defense.exe
          - os: macos-15
            binary: dist/SAWM Defense.app/Contents/MacOS/SAWM Defense
          - os: macos-15-intel
            binary: dist/SAWM Defense.app/Contents/MacOS/SAWM Defense
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux native UI test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk xdotool x11-utils libxres1
      - name: Install build and test dependencies
        run: python -m pip install ".[dev]"
      - name: Test with a real virtual display on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python -m pytest -q -ra
      - name: Test native desktop clients
        if: runner.os != 'Linux'
        run: python -m pytest -q -ra
      - name: Build native executable
        run: python packaging/build.py
      - name: Verify the packaged executable on harmless local fixtures
        run: python packaging/verify_bundle.py "${{ matrix.binary }}" --output "docs/packaged-validation-${{ runner.os }}.json"
      - name: Verify the packaged Linux window on an isolated display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python packaging/verify_gui_bundle.py "${{ matrix.binary }}" --output "docs/packaged-gui-${{ runner.os }}.json"
      - name: Verify the packaged desktop window
        if: runner.os != 'Linux'
        run: python packaging/verify_gui_bundle.py "${{ matrix.binary }}" --output "docs/packaged-gui-${{ runner.os }}.json"
      - name: Create portable release archive and checksums
        run: python packaging/release_bundle.py --proof "docs/packaged-validation-${{ runner.os }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sawm-defense-${{ matrix.os }}
          path: release/
          if-no-files-found: error
          retention-days: 14
